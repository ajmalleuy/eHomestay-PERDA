# ==============================================================================
# e-Homestay PERDA (Inap Desa) - Docker Compose Configuration
# Containers:
#   1. app (PHP 8.3-FPM Laravel Application)
#   2. webserver (Nginx serving /css, /js, /images and Laravel public routes)
#   3. db (MySQL 8.0 / MariaDB Database)
# ==============================================================================

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: perda_ehomestay_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    environment:
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: perda_ehomestay
      DB_USERNAME: perda_user
      DB_PASSWORD: perda_secret_password
    depends_on:
      - db
    networks:
      - perda_network

  webserver:
    image: nginx:alpine
    container_name: perda_ehomestay_nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - perda_network

  db:
    image: mysql:8.0
    container_name: perda_ehomestay_mysql
    restart: unless-stopped
    ports:
      - "3307:3306"
    environment:
      MYSQL_DATABASE: perda_ehomestay
      MYSQL_USER: perda_user
      MYSQL_PASSWORD: perda_secret_password
      MYSQL_ROOT_PASSWORD: root_secret_password
    volumes:
      - perda_db_data:/var/lib/mysql
    networks:
      - perda_network

networks:
  perda_network:
    driver: bridge

volumes:
  perda_db_data:

